[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "codex-local-harness"
version = "0.4.0"
description = "Deterministic boundary around local OpenCode workers"
requires-python = ">=3.11"
dependencies = [
    "mcp==2.2.0",
]

[project.scripts]
codex-review-transaction = "codex_local_harness.review:main"
codex-harness-health = "codex_local_harness.monitor:main"
codex-harness-ingest-opencode = "codex_local_harness.runtime.opencode:main"
codex-harness-publish-merge = "codex_local_harness.merge_publish:main"
codex-harness-diagnostic = "codex_local_harness.diagnostic_cli:main"
codex-harness-dashboard = "codex_local_harness.dashboard:main"
codex-harness-observe = "codex_local_harness.observe_cli:main"
codex-harness-operation-usage = "codex_local_harness.operation_usage:main"
codex-harness-claude-usage = "codex_local_harness.claude_usage:main"
codex-harness-plan = "codex_local_harness.plan_cli:main"
codex-harness-checkpoint = "codex_local_harness.checkpoint_cli:main"
codex-harness-compaction = "codex_local_harness.compaction_cli:main"
codex-local-worker-v5 = "codex_local_harness.v5_runner:main"
codex-harness-benchmark = "codex_local_harness.benchmark_cli:main"
codex-local-vision-mcp = "codex_local_harness.vision_mcp_server:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
