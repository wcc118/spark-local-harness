[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "codex-local-harness"
version = "2.0.0"
description = "Deterministic boundary around local OpenCode workers"
requires-python = ">=3.11"

[project.scripts]
codex-review-transaction = "codex_local_harness.review:main"
codex-harness-health = "codex_local_harness.monitor:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
