<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Load summary</title>
<style>
  :root { color-scheme: light; }
  body { margin: 0; padding: 24px; font-family: -apple-system, Segoe UI, Roboto, sans-serif; background: #f6f7f9; color: #1a1d29; }
  h1 { font-size: 20px; margin: 0 0 16px; }
  .card { background: #fff; border: 1px solid #e2e5eb; border-radius: 8px; padding: 20px; max-width: 640px; }
  .legend { display: flex; gap: 20px; margin-bottom: 12px; font-size: 13px; }
  .legend-item { display: flex; align-items: center; gap: 6px; }
  .swatch { width: 12px; height: 12px; border-radius: 2px; display: inline-block; }
  .swatch-a { background: #2f6fed; }
  .swatch-b { background: #e07a1f; }
  svg { display: block; margin: 8px 0 16px; }
  table { border-collapse: collapse; width: 100%; font-size: 13px; margin-bottom: 16px; }
  th, td { text-align: left; padding: 6px 10px; border-bottom: 1px solid #eef0f3; }
  th { color: #6b7280; font-weight: 600; }
  .summary { display: flex; justify-content: space-between; align-items: baseline; border-top: 1px solid #e2e5eb; padding-top: 12px; }
  .summary-label { font-size: 13px; color: #6b7280; }
  .summary-value { font-size: 22px; font-weight: 700; }
  .axis-label { font-size: 11px; fill: #6b7280; }
</style>
</head>
<body>
  <h1>Load summary &mdash; three stations</h1>
  <div class="card">
    <div class="legend">
      <span class="legend-item"><span class="swatch swatch-a"></span>Series A (measured)</span>
      <span class="legend-item" id="legend-b" style="display:none"><span class="swatch swatch-b"></span>Series B (predicted)</span>
    </div>
    <svg id="chart" width="400" height="160" viewBox="0 0 400 160">
      <line x1="40" y1="10" x2="40" y2="130" stroke="#c7ccd6" stroke-width="1"/>
      <line x1="40" y1="130" x2="380" y2="130" stroke="#c7ccd6" stroke-width="1"/>
      <text class="axis-label" id="axis-max-label" x="8" y="14">40</text>
      <text class="axis-label" x="8" y="134">0</text>
      <rect id="bar-1" class="swatch-a" x="70" y="94" width="28" height="36" fill="#2f6fed"/>
      <rect id="bar-2" class="swatch-a" x="180" y="40" width="28" height="90" fill="#2f6fed"/>
      <rect id="bar-3" class="swatch-a" x="290" y="76" width="28" height="54" fill="#2f6fed"/>
      <text class="axis-label" x="70" y="145">St. 1</text>
      <text class="axis-label" x="180" y="145">St. 2</text>
      <text class="axis-label" x="290" y="145">St. 3</text>
    </svg>
    <table>
      <thead><tr><th>Station</th><th>Force [kN]</th></tr></thead>
      <tbody id="table-body">
        <tr id="row-1"><td>Station 1</td><td id="value-1">12.0</td></tr>
        <tr id="row-2"><td>Station 2</td><td id="value-2" style="position:relative">30.0</td></tr>
        <tr id="row-3"><td>Station 3</td><td id="value-3">18.0</td></tr>
      </tbody>
    </table>
    <div class="summary">
      <span class="summary-label">Total <span id="total-unit">[kN]</span></span>
      <span class="summary-value" id="total-value">60.0</span>
    </div>
  </div>
</body>
</html>
